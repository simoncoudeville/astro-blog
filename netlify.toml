[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 4321
  port = 8888
  timeout = 60

[functions]
  directory = "netlify/functions"

# TD-3 Remote lives in its own Netlify site (td3-remote.netlify.app). It is shown
# here at /td3-remote/ without changing the address, so its files are not copied
# into this repo and it keeps deploying from its own repo.
[[redirects]]
  from = "/td3-remote"
  to = "/td3-remote/"
  status = 301

[[redirects]]
  from = "/td3-remote/*"
  to = "https://td3-remote.netlify.app/:splat"
  status = 200
  force = true
